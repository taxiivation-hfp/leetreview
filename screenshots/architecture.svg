<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" font-family="system-ui, sans-serif" font-size="13">
  <style>
    .box { fill: #f6f8fa; stroke: #8b949e; stroke-width: 1.2; rx: 8; }
    .ext { fill: #fff3e0; stroke: #ffb454; }
    .t { fill: #24292f; }
    .m { fill: #57606a; font-size: 11px; }
    .l { stroke: #8b949e; stroke-width: 1.4; fill: none; marker-end: url(#a); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #161b22; stroke: #8b949e; }
      .ext { fill: #2b2111; stroke: #ffb454; }
      .t { fill: #e6edf3; }
      .m { fill: #8b949e; }
    }
  </style>
  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b949e"/></marker></defs>

  <rect class="box" x="20" y="20" width="300" height="260"/>
  <text class="t" x="35" y="42" font-weight="600">leetcode.com problem page</text>
  <rect class="box" x="35" y="55" width="270" height="60"/>
  <text class="t" x="48" y="78">content.tsx</text>
  <text class="m" x="48" y="96">Mock Interview tab · React panel in Shadow DOM</text>
  <rect class="box" x="35" y="130" width="270" height="50"/>
  <text class="t" x="48" y="152">recorder.ts + pauses.ts</text>
  <text class="m" x="48" y="169">MediaRecorder 32 kbps · AnalyserNode silence</text>
  <rect class="box" x="35" y="195" width="270" height="50"/>
  <text class="t" x="48" y="217">monaco-bridge (main world)</text>
  <text class="m" x="48" y="234">reads editor code on request</text>
  <text class="m" x="48" y="268">adapters/leetcode.ts owns every selector</text>

  <rect class="box" x="360" y="110" width="170" height="80"/>
  <text class="t" x="375" y="135" font-weight="600">IndexedDB (Dexie)</text>
  <text class="m" x="375" y="155">sessions · audio · transcripts</text>
  <text class="m" x="375" y="171">reviews · recovery chunks</text>

  <rect class="box" x="360" y="20" width="170" height="60"/>
  <text class="t" x="375" y="45" font-weight="600">background.ts</text>
  <text class="m" x="375" y="65">service worker, holds the keys</text>

  <rect class="box ext" x="580" y="20" width="160" height="50"/>
  <text class="t" x="595" y="42">Groq Whisper</text>
  <text class="m" x="595" y="60">on Transcribe click</text>
  <rect class="box ext" x="580" y="90" width="160" height="50"/>
  <text class="t" x="595" y="112">Anthropic Claude</text>
  <text class="m" x="595" y="130">on Review click</text>

  <path class="l" d="M320,85 L358,55"/>
  <path class="l" d="M320,150 L358,150"/>
  <path class="l" d="M445,108 L445,82"/>
  <path class="l" d="M530,45 L578,45"/>
  <path class="l" d="M530,60 L578,110"/>
  <text class="m" x="590" y="165">nothing else leaves the device</text>
</svg>
